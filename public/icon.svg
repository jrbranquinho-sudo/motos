<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="motosGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7a18" />
      <stop offset="50%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="silverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#f97316" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background Squircle Card -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" />
  <rect x="1" y="1" width="62" height="62" rx="15" fill="none" stroke="url(#motosGrad)" stroke-width="1.75" stroke-opacity="0.7" />

  <!-- Crossed Tools Emblem (Chave de Boca + Chave de Fenda) -->
  <g filter="url(#glow)">
    <!-- 1. CHAVE DE BOCA (Wrench) - Top-Left to Bottom-Right -->
    <g transform="rotate(-45 32 32)">
      <!-- Wrench Shaft -->
      <rect x="29" y="14" width="6" height="36" rx="2" fill="url(#silverGrad)" />
      <rect x="30.5" y="18" width="3" height="28" rx="1" fill="#334155" opacity="0.6" />

      <!-- Wrench Top Head (Open-ended Jaw / Chave de Boca) -->
      <path d="M25 15 C25 8, 39 8, 39 15 C39 18, 36 20, 36 22 L28 22 C28 20, 25 18, 25 15 Z" fill="url(#motosGrad)" />
      <!-- Jaw Mouth Cutout -->
      <polygon points="32,15 28.5,8 35.5,8" fill="#18181b" />
      <circle cx="32" cy="15" r="2.5" fill="#18181b" />

      <!-- Wrench Bottom Head (Ring / Box End) -->
      <circle cx="32" cy="50" r="6.5" fill="url(#motosGrad)" />
      <circle cx="32" cy="50" r="3.2" fill="#18181b" />
    </g>

    <!-- 2. CHAVE DE FENDA (Screwdriver) - Top-Right to Bottom-Left -->
    <g transform="rotate(45 32 32)">
      <!-- Screwdriver Blade Tip (Flat Keystone Head) -->
      <path d="M30 9 L34 9 L33.5 14 L30.5 14 Z" fill="url(#silverGrad)" />
      <line x1="30" y1="9" x2="34" y2="9" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" />

      <!-- Screwdriver Round Shank / Shaft -->
      <rect x="30.5" y="14" width="3" height="20" fill="url(#silverGrad)" rx="0.8" />
      <rect x="31.2" y="14" width="1.2" height="20" fill="#ffffff" opacity="0.8" />

      <!-- Screwdriver Bolster / Collar -->
      <rect x="29" y="32" width="6" height="3.5" rx="1" fill="url(#motosGrad)" />

      <!-- Screwdriver Ergonomic Handle with Fluted Grips -->
      <path d="M28 35.5 C26 38, 26 48, 28 53 C29 55, 35 55, 36 53 C38 48, 38 38, 36 35.5 Z" fill="url(#motosGrad)" />
      <!-- Handle Grooves -->
      <line x1="30" y1="38" x2="30" y2="50" stroke="#09090b" stroke-width="1.2" stroke-linecap="round" opacity="0.6" />
      <line x1="32" y1="37" x2="32" y2="51" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" opacity="0.5" />
      <line x1="34" y1="38" x2="34" y2="50" stroke="#09090b" stroke-width="1.2" stroke-linecap="round" opacity="0.6" />
      <!-- Handle Butt -->
      <circle cx="32" cy="53.5" r="2.2" fill="#09090b" opacity="0.5" />
    </g>
  </g>

  <!-- Central Spark / Pivot Flare -->
  <circle cx="32" cy="32" r="2" fill="#ffffff" opacity="0.9" />
  <circle cx="32" cy="32" r="3.5" fill="#f97316" opacity="0.4" />
</svg>
